<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>music lab · chip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap">
<style>
  body { margin: 0; min-height: 100vh; background: #0d1630; color: #fff; font-family: 'Tiny5', monospace; display: grid; place-items: center; }
  .box { width: min(560px, calc(100vw - 48px)); background: #111; padding: 18px 20px 22px; box-shadow: 0 -4px #fff, 0 4px #fff, -4px 0 #fff, 4px 0 #fff; }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 400; }
  .sub { opacity: .6; font-size: 15px; margin-bottom: 14px; }
  canvas { display: block; width: 100%; height: 96px; image-rendering: pixelated; background: #061008; margin: 10px 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  button { font: inherit; font-size: 16px; padding: 8px 12px; border: 0; background: #fff; color: #111; cursor: pointer; box-shadow: 0 -4px #111, 0 4px #111, -4px 0 #111, 4px 0 #111; }
  button.off { background: #333; color: #888; }
  .pos { font-size: 15px; display: flex; justify-content: space-between; opacity: .85; }
  .bar { height: 8px; background: #222; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: #e2583e; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="row"><button id="play" type="button">▶ play</button><button id="stop" type="button">■ stop</button></div>
  <canvas id="scope" width="140" height="24"></canvas>
  <div class="pos"><span id="section"></span><span id="time"></span></div>
  <div class="bar"><i id="progress"></i></div>
  <div class="row" id="mutes"></div>
</div>
<script type="module" src="./lab.ts"></script>
</body>
</html>
